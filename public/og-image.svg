<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0e1526" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>
    <linearGradient id="glow1" x1="0" y1="0" x2="600" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="glow2" x1="1200" y1="630" x2="700" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#a5b4fc" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.5" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Ambient Glows -->
  <circle cx="200" cy="150" r="350" fill="url(#glow1)" />
  <circle cx="1050" cy="480" r="400" fill="url(#glow2)" />

  <!-- Grid Pattern overlay -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <path d="M0 70H1200 M0 140H1200 M0 210H1200 M0 280H1200 M0 350H1200 M0 420H1200 M0 490H1200 M0 560H1200" />
    <path d="M100 0V630 M200 0V630 M300 0V630 M400 0V630 M500 0V630 M600 0V630 M700 0V630 M800 0V630 M900 0V630 M1000 0V630 M1100 0V630" />
  </g>

  <!-- Card Border -->
  <rect x="40" y="40" width="1120" height="550" rx="28" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- Brand Pill -->
  <g transform="translate(100, 105)">
    <rect width="280" height="42" rx="21" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" stroke-opacity="0.6" />
    <circle cx="24" cy="21" r="6" fill="#10b981" />
    <text x="40" y="26" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" letter-spacing="1">IIIT SURAT &bull; CSE '29</text>
  </g>

  <!-- Name Title -->
  <text x="100" y="225" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="800" letter-spacing="-1">Hanish Musini</text>

  <!-- Subtitle Tagline -->
  <text x="100" y="280" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="500">Software Developer &bull; Founder of UniSell &bull; AI &amp; Data Intern</text>

  <!-- Bio Snippet -->
  <text x="100" y="340" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400">
    Building high-performance scalable web systems, ML pipelines, and empowering SME commerce.
  </text>

  <!-- Tags Container -->
  <g transform="translate(100, 420)">
    <!-- Tag 1: UniSell -->
    <rect x="0" y="0" width="220" height="48" rx="14" fill="#18181b" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.5" />
    <text x="24" y="30" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="600">🚀 UniSell Founder</text>

    <!-- Tag 2: DecodeLabs -->
    <rect x="240" y="0" width="230" height="48" rx="14" fill="#18181b" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.5" />
    <text x="264" y="30" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="600">🧠 DecodeLabs AI</text>

    <!-- Tag 3: iStudio -->
    <rect x="490" y="0" width="220" height="48" rx="14" fill="#18181b" stroke="#10b981" stroke-width="1" stroke-opacity="0.5" />
    <text x="514" y="30" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="600">📊 iStudio Analytics</text>

    <!-- Tag 4: KANAD Hackathon -->
    <rect x="730" y="0" width="260" height="48" rx="14" fill="#18181b" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.5" />
    <text x="754" y="30" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="600">🏆 KANAD Finalist '26</text>
  </g>

  <!-- Footer Link -->
  <g transform="translate(100, 520)">
    <text x="0" y="24" fill="#6366f1" font-family="monospace" font-size="18" font-weight="600">portfolio-hanish.onrender.com</text>
    <text x="820" y="24" fill="#475569" font-family="monospace" font-size="16">github.com/hanish07-CEO</text>
  </g>
</svg>
